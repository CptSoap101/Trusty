<title>Trusty Ofisina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<meta name="apple-mobile-web-app-title" content="Trusty">
<meta name="application-name" content="Trusty">
<meta name="theme-color" content="#121418">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: desktop = slim sidebar + content column; phone = logo bar + content + floating pill nav. A live road scene runs along the bottom of the screen. Palette from the Trusty logo: road blue, asphalt, lane-line yellow. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F7FB; --line:#E6EBF2; --line-2:#D7DFEA;
  --ink:#0C1220; --muted:#525C6E; --accent:#2F74D0; --accent-2:#18B4F5; --accent-deep:#1D4FA0; --accent-soft:#EDF4FE; --on-accent:#FFFFFF;
  --lane:#FFD400; --lane-ink:#1B1B1D;
  --night:#FFFFFF; --on-night:#0C1220; --night-muted:#667185; --night-line:#E6EBF2;
  --good:#11845A; --good-soft:#E4F6EE; --warn:#A35F00; --warn-soft:#FFF4DA; --bad:#D0342C; --bad-soft:#FDE8E6;
  --walk:#F1F4F8; --curb:#D8DFE8; --sky-a:#FFFFFF;
  --grad:linear-gradient(135deg,#2F74D0 0%,#18B4F5 100%);
  --f-display:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif; --f-body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif; --f-mono:"Nunito",ui-rounded,system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 1px 2px rgba(12,18,32,.04),0 8px 24px rgba(12,18,32,.06); --lift:0 10px 26px rgba(47,116,208,.28);
  --glow:0 0 0 1px rgba(47,116,208,.14),0 14px 34px rgba(47,116,208,.14);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(34px,6vw,52px);font-weight:700;line-height:.98;letter-spacing:-.035em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.logo b{font-family:var(--f-display);font-size:17px;letter-spacing:-.02em;display:block;line-height:1.1}
.logo span{font-size:12px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;border:0;background:none;text-align:left;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--night);color:var(--on-night)}
.nav-btn svg{width:20px;height:20px;flex:none}
.side .who{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line)}
main{min-width:0;padding-block:32px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.bottom{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-top:20px}
  .bottom{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:8px;justify-content:space-around;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.12)}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 8px;border-radius:14px;min-width:56px}
  .bottom button svg{width:20px;height:20px}
  .bottom button.on{color:var(--accent)}
  .bottom .plus{width:48px;height:48px;min-width:48px;border-radius:50%;background:var(--night);color:var(--on-night);justify-content:center;padding:0}
}

/* building blocks */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2.stack,.g3.stack{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.card.soft{background:var(--surface-2);border-color:transparent}
.card.night{background:var(--night);color:var(--on-night);border-color:var(--night-line)}
.card.night .muted,.card.night .eyebrow{color:var(--night-muted)}
.card.hot{background:var(--accent);color:var(--on-accent);border-color:transparent}
.card.hot .muted{color:rgba(255,255,255,.82)}
.big{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big.orange{color:var(--accent-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--night);border-color:var(--night);color:var(--on-night)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;color:var(--ink);text-decoration:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--night);color:var(--on-night);border-color:var(--night)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.hot{background:var(--accent-soft);color:var(--accent)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.vlabel{font-size:12px;font-weight:600;color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;min-width:0;text-align:left;width:100%}
button.item:hover,.item.click:hover{border-color:var(--ink)}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .end{text-align:right;flex:none}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--accent-soft);color:var(--accent);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:76px;height:76px;font-size:26px}
.time{font-family:var(--f-display);font-weight:700;font-size:17px;width:56px;flex:none}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.card.night .bar{background:var(--night-line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.stat-split{display:flex;gap:0}
.stat-split>div{flex:1;padding:0 16px;border-left:1px solid var(--night-line);min-width:0}
.stat-split>div:first-child{padding-left:0;border-left:0}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:26px;text-align:center;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.alert .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.alert .dot svg{width:17px;height:17px}
.table-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)} tr.sel td{background:var(--accent-soft)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:40px;border-radius:999px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);width:100%;text-align:left}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--good)} .switch.on::after{transform:translateX(18px)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.45);display:flex;align-items:center;justify-content:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sheet{background:var(--bg);border-radius:28px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.sheet.wide{width:min(980px,100%)}
@media (max-width:600px){#modal{align-items:flex-end;padding:0}.sheet{border-radius:28px 28px 0 0;max-height:92vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.steps{display:flex;gap:6px}.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}.steps i.on{background:var(--accent)}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.pick:hover{border-color:var(--ink)}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pick .price{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em}
.pick .tag{position:absolute;top:12px;right:12px}
.pick ul{margin:4px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.veh-ico{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center}
.veh-ico svg{width:24px;height:24px}
.confirm-box{border:1px solid var(--bad-soft);background:var(--bad-soft);color:var(--ink);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--night);color:var(--on-night);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (min-width:861px){#toast{bottom:28px}}
.banner{padding:12px 16px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--warn);font-weight:500;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.thumb:hover{border-color:var(--ink)}
.thumb .ph{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb .ph img{width:100%;height:100%;object-fit:cover}
.thumb .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.wday b{font-family:var(--f-display);font-size:18px}
.wday small{font-size:12px;color:var(--muted)}
.wday.on{background:var(--night);color:var(--on-night);border-color:var(--night)}
.wday.on small{color:var(--night-muted)}
.wday .cnt{font-size:12px;font-weight:700;color:var(--accent);min-height:14px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line)}
.chart .rev{fill:var(--accent)} .chart .exp{fill:var(--ink);opacity:.82}
.chart .hit{fill:transparent;cursor:pointer} .chart .hit:hover{fill:var(--surface-2)} .chart .hitsel{fill:var(--accent-soft)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
canvas.preview{width:100%;max-width:420px;height:auto;border-radius:18px;border:1px solid var(--line);display:block;background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.split-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.split-top{grid-template-columns:minmax(0,1fr)}}
.hide-sm{} @media (max-width:520px){.hide-sm{display:none}.stat-split .big{font-size:20px!important}.stat-split>div{padding:0 10px}.item.doc{flex-wrap:wrap}.item.doc .grow{flex:1 1 calc(100% - 60px)}.item.doc .end{margin-left:58px;flex:1;text-align:left}}

/* ── brand + motion layer ── */
.logo{flex-direction:column;align-items:stretch;gap:8px}
.logo-tile{background:#fff;border-radius:18px;padding:12px 14px;border:1px solid var(--line);display:block}
.logo-tile img{display:block;width:100%;height:auto}
.logo small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-left:4px}
.side{z-index:5}
main{position:relative;z-index:2}
#bottom{z-index:30}
main{padding-bottom:24px}
.btn,.chip,.icon-btn,.item,.pick,.nav-btn,.alert,.toggle,.thumb,.wday,.bottom button{position:relative;overflow:hidden;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background-color .2s,border-color .2s,color .2s;-webkit-tap-highlight-color:transparent}
.btn:hover,.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.primary:hover{box-shadow:var(--lift)}
.btn:active,.chip:active,.icon-btn:active,.pick:active,.wday:active,.bottom button:active{transform:scale(.95);transition-duration:.08s}
button.item:hover,.item.click:hover,.alert:hover,.thumb:hover,.pick:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
button.item:active,.alert:active,.thumb:active,.toggle:active{transform:scale(.985)}
.nav-btn:hover{transform:translateX(3px)}
.nav-btn.on{box-shadow:inset 3px 0 0 var(--lane)}
svg[class*="i-"]{transition:transform .25s var(--spring)}
.btn:hover .i-right,.item:hover .i-right,.alert:hover .i-right{transform:translateX(3px)}
.btn:hover .i-plus,.bottom .plus:hover .i-plus{transform:rotate(90deg)}
.btn:hover .i-down{transform:translateY(2px)} .btn:hover .i-up{transform:translateY(-2px)}
.btn:hover .i-chat{transform:rotate(-12deg) scale(1.08)}
.bottom .plus{background:var(--accent);box-shadow:0 6px 18px rgba(47,116,208,.45)}
.bottom button.on svg{animation:pop .45s var(--spring)}
.switch::after{transition:transform .35s var(--spring)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:ripple .6s var(--ease) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px) scale(.98)}}
.wrap.enter>*{animation:rise .55s var(--ease) both}
.wrap.enter>*:nth-child(2){animation-delay:.04s}.wrap.enter>*:nth-child(3){animation-delay:.08s}.wrap.enter>*:nth-child(4){animation-delay:.12s}
.wrap.enter>*:nth-child(5){animation-delay:.16s}.wrap.enter>*:nth-child(6){animation-delay:.2s}.wrap.enter>*:nth-child(n+7){animation-delay:.24s}
.bar i{transform-origin:left center}
.wrap.enter .bar i{animation:grow .9s .25s var(--ease) both}
#modal:not([hidden]){animation:fadeIn .2s ease both;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal .sheet{animation:sheetUp .38s var(--ease) both}
#toast.pop{animation:sheetUp .3s var(--spring) both}
.card.hot,.card.night.road{position:relative;overflow:hidden}
.card.hot{background:linear-gradient(135deg,var(--accent),#1F5FB8)}
.card.hot::after,.card.night.road::after{content:"";position:absolute;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,var(--lane) 0 26px,transparent 26px 50px);animation:lane 1.6s linear infinite}
.card.hot::after{bottom:0;opacity:.9}
.card.night.road::after{top:0}
@keyframes lane{to{background-position:50px 0}}
.big.orange{color:var(--lane)}
.card.night .bar i{background:var(--lane)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wday.on{background:var(--accent);border-color:var(--accent)}
.wday.on .cnt{color:var(--lane)}
.vlabel{color:var(--accent)}
h1 .hl{background:linear-gradient(transparent 62%,var(--lane) 62% 88%,transparent 88%);padding:0 4px;margin:0 -4px}

/* ── road scene ── */
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.col main{flex:1}
.scene{position:relative;flex:none;height:206px;pointer-events:none;overflow:hidden;margin-top:12px}
@media (max-width:860px){.col{padding-bottom:0}.scene{height:calc(206px + 70px + env(safe-area-inset-bottom,0px))}.scene .walkway{bottom:calc(166px + env(safe-area-inset-bottom,0px))}.scene .asphalt{bottom:calc(70px + env(safe-area-inset-bottom,0px))}.scene .sign{bottom:calc(188px + env(safe-area-inset-bottom,0px))}.scene .ped{bottom:calc(174px + env(safe-area-inset-bottom,0px))}.scene .gantry{bottom:calc(70px + env(safe-area-inset-bottom,0px))}.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom,0px));background:#C9D1DC}}
.scene .fade{position:absolute;inset:0 0 auto;height:90px;background:linear-gradient(var(--bg),transparent)}
.walkway{position:absolute;left:0;right:0;bottom:96px;height:28px;background:var(--walk);border-bottom:6px solid var(--curb)}
.walkway::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.06) 58px 60px)}
.asphalt{position:absolute;left:0;right:0;bottom:0;height:96px;background:#222327}
.asphalt::before{content:"";position:absolute;left:0;right:0;top:46px;height:4px;background:repeating-linear-gradient(90deg,var(--lane) 0 34px,transparent 34px 64px)}
.asphalt::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:rgba(255,255,255,.55)}
.zebra{position:absolute;bottom:8px;left:62%;width:54px;height:86px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.8) 0 8px,transparent 8px 16px)}
.veh{position:absolute;left:0;will-change:transform}
.veh svg{display:block}
.lane-a{bottom:50px}.lane-b{bottom:6px}
.veh.r{animation:driveR var(--d,16s) linear infinite;animation-delay:var(--dl,0s)}
.veh.l{animation:driveL var(--d,18s) linear infinite;animation-delay:var(--dl,0s)}
.veh.l svg{transform:scaleX(-1)}
@keyframes driveR{from{transform:translateX(-180px)}to{transform:translateX(calc(var(--sw,100vw) + 20px))}}
@keyframes driveL{from{transform:translateX(calc(var(--sw,100vw) + 20px))}to{transform:translateX(-180px)}}
.veh .wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ped{position:absolute;bottom:104px;left:0;animation:walkR var(--d,60s) linear infinite;animation-delay:var(--dl,0s)}
.ped.l{animation-name:walkL}.ped.l svg{transform:scaleX(-1)}
@keyframes walkR{from{transform:translateX(-40px)}to{transform:translateX(calc(var(--sw,100vw) + 10px))}}
@keyframes walkL{from{transform:translateX(calc(var(--sw,100vw) + 10px))}to{transform:translateX(-40px)}}
.ped .lg,.ped .ar{transform-box:fill-box;transform-origin:top center;animation:stride .7s ease-in-out infinite alternate}
.ped .lg.b,.ped .ar.a{animation-direction:alternate-reverse}
@keyframes stride{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
.ped .bob{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1px)}}
.sign{position:absolute;bottom:118px;display:flex;flex-direction:column;align-items:center}
.sign .pole{width:4px;background:#8C96A3;height:var(--h,52px);border-radius:2px}
.gantry{position:absolute;bottom:0;right:6%;width:230px;height:206px}
.gantry .post{position:absolute;bottom:0;width:7px;height:180px;background:#7E8894;border-radius:3px}
.gantry .board{position:absolute;top:8px;left:-6px;right:-6px;height:52px;border-radius:8px;background:var(--accent);border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.gantry .board b{font-family:var(--f-display);font-size:16px;letter-spacing:-.01em;line-height:1}
.gantry .board small{display:block;font-size:10px;opacity:.85;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.gantry .arrow{font-size:22px;font-weight:800;color:var(--lane);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}

@media (max-width:520px){.sign.s2,.sign.s3,.sign.s4{display:none}.gantry{width:200px;right:4%}.gantry .board b{font-size:14px}.item.lesson{flex-wrap:wrap}.item.lesson .grow{flex:1 1 calc(100% - 72px)}.item.lesson .acts{flex:1 1 100%;justify-content:flex-end}}
.tlight{width:16px;padding:3px;border-radius:5px;background:#1B1C1F;display:flex;flex-direction:column;gap:3px}
.tlight i{width:10px;height:10px;border-radius:50%;background:#3a3a3a}
.tlight .r{animation:tlR 9s infinite}.tlight .y{animation:tlY 9s infinite}.tlight .g{animation:tlG 9s infinite}
@keyframes tlR{0%,40%{background:#FF3B30;box-shadow:0 0 8px #FF3B30}41%,100%{background:#3a3a3a}}
@keyframes tlY{0%,40%{background:#3a3a3a}41%,52%{background:#FFD900;box-shadow:0 0 8px #FFD900}53%,100%{background:#3a3a3a}}
@keyframes tlG{0%,52%{background:#3a3a3a}53%,100%{background:#34C759;box-shadow:0 0 8px #34C759}}
@media (prefers-reduced-motion:reduce){.veh,.ped,.ped *,.veh *,.card.hot::after,.card.night.road::after,.gantry .arrow,.tlight i{animation:none!important}.veh.r{transform:translateX(20vw)}.veh.l{transform:translateX(55vw)}.ped{transform:translateX(35vw)}}

/* ── white top bar ── */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#FFFFFF;color:#111418;border-bottom:1px solid #E4E9F0;box-shadow:0 1px 0 rgba(17,30,60,.02),0 6px 20px rgba(17,30,60,.05)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:#FFFFFF}
.topbar-in{height:100px;display:flex;align-items:center;gap:20px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:16px;border:0;background:none;padding:0;color:inherit;text-decoration:none}
.brand img{height:76px;width:auto;display:block;transition:transform .3s var(--spring)}
.brand:hover img{transform:rotate(-2deg) scale(1.03)}

.brand .name{display:flex;flex-direction:column;line-height:1.1;text-align:left}

.brand .name span{font-size:12px;color:#6B7480}
.topbar .spacer{flex:1}
.topbar .today{font-size:13px;color:#6B7480;font-weight:500}
.seg{display:inline-flex;align-items:center;background:#EEF2F7;border-radius:999px;padding:4px;gap:2px}
.seg .lbl{font-size:12px;color:#6B7480;font-weight:600;padding:0 8px 0 10px}
.seg button{border:0;background:transparent;color:#4B5563;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;transition:background-color .25s var(--ease),color .2s,box-shadow .25s var(--ease),transform .15s}
.seg button:hover{color:#111418}
.seg button:active{transform:scale(.95)}
.seg button.on{background:#FFFFFF;color:#111418;box-shadow:0 1px 2px rgba(17,30,60,.08),0 4px 10px rgba(17,30,60,.08)}
.seg button.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lane);margin-right:7px;vertical-align:1px;box-shadow:0 0 0 2px rgba(255,217,0,.25)}
.topbar .btn.primary{padding:11px 18px}
.side{top:calc(100px + env(safe-area-inset-top,0px));height:calc(100vh - 100px - env(safe-area-inset-top,0px));padding-top:22px}
.side .foot{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .topbar-in{height:78px;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand img{height:58px}.brand .sep,.brand .name,.topbar .today,.topbar .btn.primary,.seg .lbl{display:none}
  .seg button{padding:7px 12px}
}

html,body{background:#FFFFFF}

.big{font-weight:600;font-size:28px}
.time{font-weight:600;font-size:16px}
.side{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--line)}
.nav-btn{color:#4E596B;font-weight:500}

@keyframes scan{to{background-position:-200% 0}}
.card{border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);background:rgba(255,255,255,.92)}

.card.hot::after{display:none}

.item,.alert,.toggle,.thumb,.pick{background:rgba(255,255,255,.94);border-color:var(--line)}
button.item:hover,.item.click:hover,.alert:hover,.thumb:hover,.pick:hover{border-color:rgba(47,116,208,.45);box-shadow:var(--glow)}

.avatar{background:var(--grad);color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(47,116,208,.25)}

input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:#fff;border-color:var(--line-2)}
.empty{background:rgba(255,255,255,.7);border-color:var(--line-2)}

/* ── rounded type + city map pass ── */
body{font-size:15.5px;letter-spacing:.005em}
h1,h2,h3,.big{font-family:var(--f-display);font-weight:800;letter-spacing:-.015em}
h1{font-size:clamp(30px,4.4vw,44px);line-height:1.05}
h2{font-size:21px}
.eyebrow,.vlabel,th{font-family:var(--f-body);font-weight:800;letter-spacing:.09em}
.num,.big.num,.time,.pick .price{font-family:var(--f-body);font-weight:800;letter-spacing:-.01em}
.time{font-size:18px}
.btn,.chip,.seg button,.nav-btn{font-weight:700}
.brand .name b{font-family:var(--f-display);font-size:20px;font-weight:900;letter-spacing:-.01em}

.app{position:relative;z-index:1}
.city{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.card,.item,.alert,.toggle,.thumb,.pick,.table-wrap{background:rgba(255,255,255,.86);backdrop-filter:blur(6px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}
.card.hot{background:linear-gradient(rgba(255,255,255,.96),rgba(255,255,255,.96)) padding-box,var(--grad) border-box}
.empty{background:rgba(255,255,255,.85);backdrop-filter:blur(8px)}
.side{background:rgba(255,255,255,.62)}
.nav-btn{border-radius:16px;padding:10px 12px}

/* ── ui-ux-pro-max pass: type scale, readable glass, depth ── */
:root{--t-12:12px;--t-14:14px;--t-16:16px;--t-18:18px;--t-24:24px;--t-32:32px;
  --e1:0 1px 2px rgba(12,18,32,.05),0 4px 14px rgba(12,18,32,.05);
  --e2:0 2px 4px rgba(12,18,32,.04),0 14px 36px rgba(31,79,160,.10);
  --e3:0 4px 8px rgba(12,18,32,.05),0 24px 60px rgba(31,79,160,.16);
  --glass:rgba(255,255,255,.94); --glass-edge:rgba(255,255,255,.9)}
body{font-size:var(--t-16);line-height:1.5}
.small{font-size:var(--t-14)}
h2{font-size:var(--t-24)} h3{font-size:var(--t-18)}
.card,.item,.alert,.toggle,.thumb,.pick,.table-wrap,.step{background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-edge),var(--e1)}
.card{box-shadow:inset 0 1px 0 var(--glass-edge),var(--e2)}
.card.hot{box-shadow:var(--glow),var(--e2)}
button.item:hover,.item.click:hover,.alert:hover,.thumb:hover,.pick:hover{box-shadow:inset 0 1px 0 var(--glass-edge),var(--e3);border-color:rgba(47,116,208,.35)}
.item{padding:16px 18px;gap:16px}
/* section titles: plain, readable over the map */
.section-head{background:none;border:0;padding:6px 2px 0;backdrop-filter:none;-webkit-backdrop-filter:none}
.section-head h2{font-size:var(--t-24);text-shadow:0 0 10px #fff,0 0 3px #fff,0 0 1px #fff}
.section-head h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:4px;background:var(--grad);margin-right:10px;vertical-align:2px;box-shadow:0 0 0 4px rgba(47,116,208,.12)}

  }catch(e){ db=null; }
  clearTimeout(timer);
  if(!db){ S.offline=true; render(); return; }
  for(const col of COLS){
    db.collection(col).onSnapshot(snap=>{
      S[col] = snap.docs.map(d=>({...d.data(), id:d.id}));
      S.ready[col]=true; scheduleRender();
    }, err=>{ toast("Sync problem ("+col+"): "+(err.message||err.code)); });
  }
  db.doc("settings/main").onSnapshot(s=>{ S.settings = s.exists? {...s.data()}:{}; S.ready.settings=true; scheduleRender(); });
}

function nextNumber(type, dateStr){
  const y = (dateStr||today()).slice(0,4);

}
async function createInvoice(c, lines, date, extra={}){

async function saveFile(filename, data){
  if(!downloads){ toast("Downloads aren't available in this view. Open the page in Claude."); return; }
  try{ await downloads.save({filename, data}); }
  catch(e){ if(e&&e.code==="declined") return; toast(e&&e.code==="rate_limited"?"A save prompt is already open.":"Couldn't save the file ("+((e&&e.code)||"error")+")."); }
}
function pickFile(accept){ return new Promise(res=>{ const f=$("#filePick"); f.value=""; f.accept=accept; f.onchange=()=>res(f.files[0]||null); f.click(); }); }
async function shrinkImage(file, max=1800, q=.85){
  if(!file.type.startsWith("image/") || file.type==="image/svg+xml") return file;
  const url=URL.createObjectURL(file);
  try{
    const img = await loadImg(url); const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    if(s===1 && file.size<1.5e6) return file;
    const cv=document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*s); cv.height=Math.round(img.naturalHeight*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",q));
  } finally { URL.revokeObjectURL(url); }
}
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function uploadFile(file, max){
  if(!assets) throw new Error("Uploading needs Editor access to this page.");
  const blob = await shrinkImage(file, max);
  try{ return await assets.upload(blob, blob.type?{type:blob.type}:undefined); }
  catch(e){ throw new Error(e&&e.code==="too_large"?"That file is too large (max 20 MB).":e&&e.code==="unsupported_type"?"Use a photo (JPG/PNG) or a PDF.":"Upload failed ("+((e&&e.code)||"error")+")."); }
}

const CFILTERS = [["active","Active"],["all","All"],["owing","Owes money"],["noid","ID not printed"],["usedup","Lessons used up"],["exam","Exam soon"],["passed","Passed"],["accent","Accent"],["versa","Versa"],["moto","Motor"],["archived","Archived"]];
function filteredClients(){
  const q=S.q.trim().toLowerCase(), t=today();
  return S.clients.filter(c=>{
    const st=c.status||"active";
    if(q && !(`${c.name} ${c.phone} ${c.idNumber}`.toLowerCase().includes(q))) return false;
    switch(S.cfilter){
      case "active": return st==="active";
      case "owing": return totals(c).balance>0.009;
      case "noid": return st==="active" && !c.idPrinted;
      case "usedup": return st==="active" && num(c.lessonsIncluded)>0 && num(c.lessonsTaken)>=num(c.lessonsIncluded);
      case "exam": return c.examDate && c.examDate>=t && !c.examResult;
      case "passed": return st==="passed";
      case "archived": return st==="archived";
      case "accent": case "versa": case "moto": return c.vehicle===S.cfilter && st!=="archived";
      default: return true;
    }
  }).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
}

/* finance */
function monthStats(y,m){
  const ym=y+"-"+pad(m+1); const c=cfg();
  const pays=S.payments.filter(p=>(p.date||"").startsWith(ym));
  const invs=S.invoices.filter(i=>i.type==="invoice"&&!i.void&&(i.date||"").startsWith(ym));
  const exps=S.expenses.filter(e=>(e.date||"").startsWith(ym));
  const received=pays.reduce((a,p)=>a+num(p.amount),0), invoiced=invs.reduce((a,i)=>a+num(i.amount),0), expenses=exps.reduce((a,e)=>a+num(e.amount),0);
  const omzet = c.obBasis==="invoice"?invoiced:received; const r=num(c.obRate);
  const ob = r>0? omzet*r/(100+r):0;
  return {ym,pays,invs,exps,received,invoiced,expenses,omzet,ob,net:omzet-ob-expenses};
}
function niceMax(v){ if(v<=0) return 1000; const p=10**Math.floor(Math.log10(v)); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function vFinance(){
  const y=S.year, c=cfg(); const ms=[...Array(12)].map((_,m)=>monthStats(y,m));
  const sel=ms[S.month]; const yr=ms.reduce((a,s)=>({omzet:a.omzet+s.omzet,ob:a.ob+s.ob,exp:a.exp+s.expenses,rec:a.rec+s.received}),{omzet:0,ob:0,exp:0,rec:0});
  const max=niceMax(Math.max(...ms.map(s=>Math.max(s.omzet,s.expenses))));
  const W=760,H=240,pl=56,pb=26,pt=10,cw=(W-pl-8)/12,bw=Math.min(18,cw/3);
  const yv=v=>pt+(H-pt-pb)*(1-v/max);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenses per month, ${y}"><defs><linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18B4F5"/><stop offset="1" stop-color="#2F74D0"/></linearGradient></defs>`;
  for(let k=0;k<=4;k++){ const v=max*k/4, yy=yv(v); svg+=`<line class="gl" x1="${pl}" x2="${W-4}" y1="${yy}" y2="${yy}"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("en-US",{maximumFractionDigits:1})+"k":Math.round(v)}</text>`; }
  ms.forEach((s,m)=>{ const x=pl+m*cw; svg+=`<rect class="${m===S.month?"hitsel":"hit"}" x="${x+2}" y="${pt}" width="${cw-4}" height="${H-pt-pb}" rx="8" data-act="monthSet" data-v="${m}"><title>${MONTHS_L[m]}: omzet ${money0(s.omzet)}, expenses ${money0(s.expenses)}</title></rect>`;
    const hr=(H-pt-pb)*s.omzet/max, he=(H-pt-pb)*s.expenses/max;
    if(hr>0) svg+=`<rect class="rev" x="${x+cw/2-bw-1}" y="${yv(s.omzet)}" width="${bw}" height="${hr}" rx="3" pointer-events="none"/>`;
    if(he>0) svg+=`<rect class="exp" x="${x+cw/2+1}" y="${yv(s.expenses)}" width="${bw}" height="${he}" rx="3" pointer-events="none"/>`;
    svg+=`<text x="${x+cw/2}" y="${H-8}" text-anchor="middle" ${m===S.month?'style="fill:var(--ink);font-weight:600"':""}>${MONTHS[m]}</text>`; });
  svg+=`</svg>`;
  const due = new Date(y, S.month+1, 15);

async function hostApi(action, body, isForm){
  const opts={method:body?"POST":"GET",credentials:"same-origin",headers:{"X-CSRF":HOST.csrf}};
  if(body){ if(isForm) opts.body=body; else { opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); } }
  const r=await fetch((HOST.api||"api.php")+"?action="+action,opts);
  if(r.status===401){ location.href="login.php"; throw new Error("Please log in again."); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"The server couldn't do that. Try again.");
  return j;
}

async function paintPost(cv, c, photoId, adj, editBox){
  const g=cv.getContext("2d"); const W=1080,H=1350; const k=cfg();
  try{ await document.fonts.load('800 80px "Nunito"'); }catch(e){}
  const photo=await getImg(photoId); const tpl=await getImg(k.templateId);
  if(!cv.isConnected) return;
  g.clearRect(0,0,W,H);
  const over = tpl && k.tplMode==="over";
  const box = tpl ? (editBox || k.photoBox || {x:0,y:0,w:W,h:H}) : {x:0,y:0,w:W,h:H};
  const rad = tpl ? Math.max(0, num(k.photoRadius)) : 0;
  const drawPhoto=()=>{
    if(photo){
      const s=Math.max(box.w/photo.naturalWidth, box.h/photo.naturalHeight)*(adj.zoom||1);
      const dw=photo.naturalWidth*s, dh=photo.naturalHeight*s;
      const dx=box.x+(box.w-dw)/2 + (adj.x||0)*(dw-box.w)/2, dy=box.y+(box.h-dh)/2 + (adj.y||0)*(dh-box.h)/2;
      g.save(); if(rad) roundRect(g,box.x,box.y,box.w,box.h,Math.min(rad,box.w/2,box.h/2)); else { g.beginPath(); g.rect(box.x,box.y,box.w,box.h); } g.clip(); g.drawImage(photo,dx,dy,dw,dh); g.restore();
    } else {
      g.save(); g.fillStyle="rgba(47,116,208,.18)"; if(rad) roundRect(g,box.x,box.y,box.w,box.h,Math.min(rad,box.w/2,box.h/2)); else { g.beginPath(); g.rect(box.x,box.y,box.w,box.h); } g.fill();
      g.fillStyle="rgba(255,255,255,.85)"; g.font='800 44px "Nunito", sans-serif'; g.textAlign="center"; g.textBaseline="middle"; g.fillText("Client photo", box.x+box.w/2, box.y+box.h/2); g.restore();
    }
  };
  if(tpl){
    g.fillStyle="#FFFFFF"; g.fillRect(0,0,W,H);
    if(over){ g.drawImage(tpl,0,0,W,H); drawPhoto(); } else { drawPhoto(); g.drawImage(tpl,0,0,W,H); }
    if(k.nameOn!==false && c){ drawName(g, c.name, k); }
    else if(k.nameOn!==false && !c && editBox){ drawName(g, "Client Name", k); }
    if(editBox){ g.save(); g.lineWidth=14; g.strokeStyle="#FFFFFF"; g.strokeRect(box.x,box.y,box.w,box.h); g.setLineDash([22,14]); g.lineWidth=8; g.strokeStyle="#121418"; g.strokeRect(box.x,box.y,box.w,box.h); g.setLineDash([]);
      g.fillStyle="#FFFFFF"; g.fillRect(box.x+box.w-42,box.y+box.h-42,56,56); g.fillStyle="#2F74D0"; g.fillRect(box.x+box.w-34,box.y+box.h-34,40,40); g.restore(); }
    return;
  }
  // built-in template (brand blue, matches the package posters)
  g.fillStyle="#0B2A4A"; g.fillRect(0,0,W,H); drawPhoto();
  const gr=g.createLinearGradient(0,H*0.5,0,H); gr.addColorStop(0,"rgba(5,20,50,0)"); gr.addColorStop(1,"rgba(5,20,50,.92)"); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.textAlign="left"; g.textBaseline="alphabetic";
  if(logoImg){ g.fillStyle="#fff"; roundRect(g,48,48,300,226,34); g.fill(); g.drawImage(logoImg,68,68,260,182); }
  g.fillStyle="#1B1C1F"; g.fillRect(0,H-26,W,26); g.fillStyle="#FFD900"; for(let x=10;x<W;x+=64) g.fillRect(x,H-15,36,5);
  g.fillStyle="#FFD900"; g.font='800 150px "Nunito", sans-serif'; g.fillText("PABIEN!",60,H-308);
  g.fillStyle="#fff"; g.font='800 76px "Nunito", sans-serif'; fitText(g, c?c.name:"Client name", 60, H-208, W-120, 76);
  g.font='600 40px "Nunito", sans-serif'; g.fillStyle="rgba(255,255,255,.85)";
  g.fillText(c?`Rijbewijs ${VEH[c.vehicle]?.lic||"B"} · ${VEH[c.vehicle]?.trans||""}`:"Rijbewijs B",60,H-138);
  g.fillStyle="#2F74D0"; roundRect(g,60,H-104,420,56,28); g.fill(); g.fillStyle="#fff"; g.font='700 30px "Nunito", sans-serif'; g.fillText("@trusty_autorijschool",84,H-66);
}
function drawName(g, name, k){
  const W=1080; let size=num(k.nameSize)||72; const y=num(k.nameY)||1220;
  g.save(); g.textAlign="center"; g.textBaseline="middle"; g.fillStyle=k.nameColor||"#FFFFFF";
  do { g.font=`900 ${size}px "Nunito", sans-serif`; if(g.measureText(name).width<=W-120) break; size-=4; } while(size>28);
  g.shadowColor=(k.nameColor||"#FFFFFF").toUpperCase()==="#FFFFFF"?"rgba(0,0,0,.45)":"rgba(255,255,255,.4)"; g.shadowBlur=14; g.shadowOffsetY=3;
  g.fillText(name, W/2, y); g.restore();
}

async function analyzeTemplate(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url); const W=1080,H=1350; const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    const g=cv.getContext("2d"); g.drawImage(img,0,0,W,H); const d=g.getImageData(0,0,W,H).data;
    let x0=W,y0=H,x1=-1,y1=-1,count=0;
    for(let y=0;y<H;y+=3) for(let x=0;x<W;x+=3){ if(d[(y*W+x)*4+3]<40){ count++; if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; } }
    const share=count/((W/3)*(H/3));
    if(share>0.04 && x1>x0 && y1>y0) return {mode:"behind", box:{x:x0,y:y0,w:x1-x0+3,h:y1-y0+3}};
    return {mode:"over", box:{x:140,y:170,w:800,h:800}};
  } finally { URL.revokeObjectURL(url); }
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fitText(g,t,x,y,max,size){ let s=size; const fam=g.font.replace(/\d+px/,"{}"); while(s>30){ g.font=fam.replace("{}",s+"px"); if(g.measureText(t).width<=max) break; s-=4; } g.fillText(t,x,y); }

function wizLeft(){ const d=W.data, k=cfg(); const el=$("#w_left"); if(!el) return; const price=k.prices[d.vehicle][d.pkg]; el.textContent=money(price-num($("#w_disc").value)-num($("#w_paid").value)); }
async function wizSave(btn){
  const d=W.data, k=cfg(); Object.assign(d, formVals($("#wf")));
  const price=num(k.prices[d.vehicle][d.pkg]), disc=num(d.discount), paid=num(d.paid);
  btn.disabled=true;
  const ok = await safe(async()=>{
    const id=uid();
    const c={id, name:d.name.trim(), phone:d.phone||"", idNumber:d.idNumber||"", dob:d.dob||"", address:d.address||"", notes:d.notes||"",
      vehicle:d.vehicle, pkg:d.pkg, price:price-disc, lessonsIncluded:PKG_LESSONS[d.pkg], lessonsTaken:Math.max(0,Math.round(num(d.taken))),
      instructor:d.instructor, idPrinted:!!d.idPrinted, idPrintedAt:d.idPrinted?today():"", examDate:d.examDate||"", examResult:"", photoId:null, posted:false,
      status:"active", createdAt:new Date().toISOString(), createdBy:S.me||""};
    await put("clients", id, c);
    const lines=[{desc:`Pakete ${d.pkg+1} - ${PKG_LESSONS[d.pkg]}x les praktiko, ${VEH[d.vehicle].name} (${VEH[d.vehicle].trans})`, amount:price, sub:INCLUDED.join(" · ")}];
    if(disc>0) lines.push({desc:"Korting / discount", amount:-disc});
    await createInvoice(c, lines, d.date||today());
    if(paid>0) await recordPayment(c, paid, d.date||today(), d.method||"Cash", "", {total:price-disc, paid:0});
    if(d.firstDate){ const lid=uid(); await put("lessons",lid,{id:lid,type:"practical",clientId:id,clientIds:[id],date:d.firstDate,time:d.firstTime||"08:00",duration:60,instructor:d.instructor,vehicle:d.vehicle,note:"",status:"planned",reminded:false,createdAt:new Date().toISOString(),by:S.me||""}); }
    S.clientId=id;
  }, "Client saved with invoice");
  if(ok){ closeModal(); go("client"); } else btn.disabled=false;
}

function lessonDraft(){ const f=$("#lf"); const v=formVals(f); const ids=[...f.querySelectorAll("input[name=cid]:checked")].map(i=>i.value); const cids = v.type==="theory"? ids : (v.clientId?[v.clientId]:[]); return {...v, clientIds:cids}; }
function lessonCheck(){
  const f=$("#lf"); if(!f) return; const v=lessonDraft(); const id=$("[data-act=saveLesson]").dataset.id; const th=v.type==="theory";
  const cc=$("#ckCount"); if(cc) cc.textContent=v.clientIds.length+" selected";
  const toMin=t=>{const [h,m]=(t||"0:0").split(":").map(Number); return h*60+m;};
  const s=toMin(v.time), e=s+num(v.duration);
  const clash=S.lessons.filter(l=>l.id!==id && l.date===v.date && l.status!=="cancelled" && (l.instructor===v.instructor||(!th&&!isTheory(l)&&l.vehicle===v.vehicle)) && toMin(l.time)<e && toMin(l.time)+num(l.duration||60)>s);
  $("#lconf").innerHTML = clash.length?`<div class="banner">Overlaps with ${clash.map(l=>esc(lessonWho(l)+" at "+l.time+" ("+(l.instructor===v.instructor?l.instructor:VEH[l.vehicle]?.name)+")")).join(", ")}.</div>`:"";
}

function pdfBase(title){
  const {jsPDF}=window.jspdf; const d=new jsPDF({unit:"mm",format:"a4"}); const k=cfg();
  d.setFillColor(27,28,31); d.rect(0,0,210,7,"F"); d.setFillColor(255,217,0); for(let x=4;x<210;x+=12) d.rect(x,3.1,7,0.9,"F");
  if(logoData){ try{ d.addImage(logoData,"PNG",18,12,34,23.8); }catch(e){} }
  d.setFont("helvetica","bold"); d.setFontSize(11); d.setTextColor(17,20,24); d.text(pdfSafe(k.business||"Trusty Autorijschool"),18,logoData?42:24);
  d.setFont("helvetica","normal"); d.setFontSize(9); d.setTextColor(102,112,125);
  const info=[k.address,k.phone,k.email,k.kvk?"KvK "+k.kvk:"",k.crib?"CRIB "+k.crib:""].filter(Boolean);
  info.forEach((t,i)=>d.text(pdfSafe(t),18,(logoData?47:30)+i*4.2));
  d.setFont("helvetica","bold"); d.setFontSize(22); d.setTextColor(47,116,208); d.text(title,192,24,{align:"right"});
  return d;
}
const pdfMoney = n => "XCG "+(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pdfSafe = s => String(s??"").replace(/[–—]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x20-\x7E -ÿ\n]/g,"");

  rows.forEach(r=>{ d.setFont("helvetica","bold"); d.setFontSize(10.5); const lines=d.splitTextToSize(pdfSafe(r.desc),125); d.text(lines,23,y); d.text(pdfMoney(r.amount),187,y,{align:"right"}); y+=lines.length*5;
    if(r.sub){ d.setFont("helvetica","normal"); d.setFontSize(8.5); d.setTextColor(120,112,104); const s=d.splitTextToSize(pdfSafe(r.sub),125); d.text(s,23,y); y+=s.length*4.2; d.setTextColor(22,19,15);} y+=5; d.setDrawColor(232,226,220); d.line(18,y-2,192,y-2); y+=4; });
  y+=4; const r=num(k.obRate);
  const kv=(l,v,bold,color)=>{ d.setFont("helvetica",bold?"bold":"normal"); d.setFontSize(bold?12:10); d.setTextColor(...(color||[22,19,15])); d.text(l,130,y); d.text(v,187,y,{align:"right"}); y+=bold?8:6; };
  if(isR){ kv("Amount received",pdfMoney(inv.amount),true,[47,116,208]); kv("Package total",pdfMoney(inv.totalAtTime)); kv("Paid to date",pdfMoney(inv.paidAfter)); kv("Remaining balance",pdfMoney(Math.max(0,inv.balanceAfter)),true); }
  else { if(r>0){ kv("Subtotal excl. OB",pdfMoney(inv.amount-inv.amount*r/(100+r))); kv(`OB ${r}%`,pdfMoney(inv.amount*r/(100+r))); } kv("Total",pdfMoney(inv.amount),true,[47,116,208]); }
  if(inv.void){ d.setFont("helvetica","bold"); d.setFontSize(60); d.setTextColor(201,54,42); d.text("VOID",105,170,{align:"center",angle:20}); }
  y=Math.max(y+8,200); d.setFont("helvetica","normal"); d.setFontSize(9); d.setTextColor(110,104,98);

  else d.text("Thank you! / Danki!",18,y);
  d.setFontSize(8); d.setTextColor(160,150,140); d.text(pdfSafe((k.business||"")+" · Generated by Trusty Ofisina"),18,287);
  return d.output("blob");
}

  remindGroup: ds=>{ const l=S.lessons.find(x=>x.id===ds.id); const cs=lessonClients(l);
    openModal(`${head("Remind the theory class", esc(niceDate(l.date))+" · "+esc(l.time)+" · "+cs.length+" clients")}<div class="list">${cs.map(c=>`<div class="item"><div class="grow"><b>${esc(c.name)}</b><span class="small muted">${esc(c.phone||"No phone number")}</span></div>${waBtn(l,c)}</div>`).join("")}</div><div class="small muted">Each button opens WhatsApp with the reminder for that client.</div>`); },
  reminded: ds=>{ const l=S.lessons.find(x=>x.id===ds.id); if(l&&!l.reminded) safe(()=>patch("lessons",l.id,{reminded:true,remindedAt:new Date().toISOString()})); return "allow"; },
  markReminded: ds=> safe(()=>patch("lessons",ds.id,{reminded:true,remindedAt:new Date().toISOString()}),"Marked as sent"),
  dayShift: ds=>{ S.day=addDays(S.day,Number(ds.v)); render(); },
  dayToday: ()=>{ S.day=today(); render(); },
  daySet: ds=>{ S.day=ds.v; render(); },
  dayInst: ds=>{ S.dayInst=ds.v; render(); },
  dayPdf: ()=>{ const L=lessonsForSchedule(); saveFile(`Schedule ${S.day}.pdf`, dayPdf(S.day,L)); },
  dayPng: async ()=>{ const L=lessonsForSchedule(); const b=await dayPng(S.day,L); saveFile(`Schedule ${S.day}.png`, b); },
  dayCopy: ()=>{ const L=lessonsForSchedule(); const txt=`*Les schedule – ${longDate(S.day)}*\n`+L.map(l=>`${l.time}  ${lessonWho(l,true)} · ${lessonVehShort(l)} · ${l.instructor}`).join("\n")+`\n\n${cfg().business}`; copy(txt,"Schedule copied"); },
  monthSet: ds=>{ S.month=Number(ds.v); render(); },
  yearShift: ds=>{ S.year+=Number(ds.v); render(); },
  exportMonth: ()=>{ const s=monthStats(S.year,S.month); const rows=[["Type","Date","Number / vendor","Client / category","Method","Amount XCG"]];
    s.pays.forEach(p=>{ const r=S.invoices.find(i=>i.id===p.receiptId); rows.push(["Payment received",p.date,r?.number||"",client(p.clientId)?.name||"",p.method,num(p.amount).toFixed(2)]); });
    s.invs.forEach(i=>rows.push(["Invoice issued",i.date,i.number,i.clientName,"",num(i.amount).toFixed(2)]));
    s.exps.forEach(e=>rows.push(["Expense",e.date,e.vendor||"",e.category,e.paidBy||"",(-num(e.amount)).toFixed(2)]));
    rows.push([],["Omzet incl. OB","","","","",s.omzet.toFixed(2)],["OB "+num(cfg().obRate)+"%","","","","",s.ob.toFixed(2)],["Expenses","","","","",s.expenses.toFixed(2)]);
    saveFile(`Omzet ${s.ym}.csv`, rows.map(r=>r.map(csvCell).join(",")).join("\n")); },
  exportMonthPdf: ()=>{ const s=monthStats(S.year,S.month); const r=num(cfg().obRate);
    saveFile(`OB aangifte ${s.ym}.pdf`, reportPdf(`Omzetbelasting ${MONTHS_L[S.month]} ${S.year}`,null,[
      {h:"Summary",rows:[["Payments received",pdfMoney(s.received)],["Invoiced",pdfMoney(s.invoiced)],["Omzet incl. OB ("+(cfg().obBasis==="invoice"?"invoice":"cash")+" basis)",pdfMoney(s.omzet),1],["Omzet excl. OB",pdfMoney(s.omzet-s.ob)],[`OB to pay (${r}%)`,pdfMoney(s.ob),1],["Expenses",pdfMoney(s.expenses)]]},
      {h:"Payments",rows:s.pays.map(p=>[`${p.date}  ${client(p.clientId)?.name||""} (${p.method})`,pdfMoney(p.amount)])},
      {h:"Expenses",rows:s.exps.map(e=>[`${e.date}  ${e.category}${e.vendor?" - "+e.vendor:""}`,pdfMoney(e.amount)])}])); },
  exportYear: ()=>{ const y=S.year; const rows=[["Month","Payments received","Invoiced","Omzet incl. OB","OB","Expenses","Result"]];
    let T=[0,0,0,0,0,0]; for(let m=0;m<12;m++){ const s=monthStats(y,m); const v=[s.received,s.invoiced,s.omzet,s.ob,s.expenses,s.omzet-s.ob-s.expenses]; v.forEach((x,i)=>T[i]+=x); rows.push([MONTHS_L[m],...v.map(x=>x.toFixed(2))]); }
    rows.push(["Total",...T.map(x=>x.toFixed(2))],[],["Expense category","Amount"]);
    const byCat={}; S.expenses.filter(e=>(e.date||"").startsWith(String(y))).forEach(e=>byCat[e.category||"Other"]=(byCat[e.category||"Other"]||0)+num(e.amount)); Object.entries(byCat).forEach(([k,v])=>rows.push([k,v.toFixed(2)]));
    rows.push([],["All expenses","Date","Category","Vendor","Vehicle","Paid by","Amount","Note"]); S.expenses.filter(e=>(e.date||"").startsWith(String(y))).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>rows.push(["",e.date,e.category,e.vendor||"",VEH[e.vehicle]?.name||"",e.paidBy||"",num(e.amount).toFixed(2),e.note||""]));
    saveFile(`Jaaroverzicht ${y}.csv`, rows.map(r=>r.map(csvCell).join(",")).join("\n")); },
  exportYearPdf: ()=>{ const y=S.year; const ms=[...Array(12)].map((_,m)=>monthStats(y,m)); const T=ms.reduce((a,s)=>({o:a.o+s.omzet,b:a.b+s.ob,e:a.e+s.expenses}),{o:0,b:0,e:0});
    const byCat={}; S.expenses.filter(e=>(e.date||"").startsWith(String(y))).forEach(e=>byCat[e.category||"Other"]=(byCat[e.category||"Other"]||0)+num(e.amount));
    saveFile(`Jaaroverzicht ${y}.pdf`, reportPdf(`Year overview ${y} (inkomstenbelasting)`,null,[
      {h:"Totals",rows:[["Omzet incl. OB",pdfMoney(T.o)],["OB",pdfMoney(T.b)],["Omzet excl. OB",pdfMoney(T.o-T.b),1],["Expenses",pdfMoney(T.e)],["Result before income tax",pdfMoney(T.o-T.b-T.e),1]]},
      {h:"Per month (omzet excl. OB / expenses)",rows:ms.map((s,m)=>[MONTHS_L[m],pdfMoney(s.omzet-s.ob)+"  /  "+pdfMoney(s.expenses)])},
      {h:"Expenses by category",rows:Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,pdfMoney(v)])}])); },
  expNew: ()=>{ closeModal(); if(!assets) return expNew(false); expNew(true); },
  expNewNoPhoto: ()=> expNew(false),
  expMonth: ds=>{ const [y,m]=S.expMonth.split("-").map(Number); const d=new Date(y,m-1+Number(ds.v),1); S.expMonth=d.getFullYear()+"-"+pad(d.getMonth()+1); render(); },
  saveExp: async (ds,el)=>{ const v=formVals($("#xf")); const a=num(v.amount); if(a<=0) return toast("Enter the amount"); el.disabled=true; el.textContent="Saving…";
    const ok=await safe(async()=>{ let fileId=null, fileType=""; if(expDraft&&expDraft.file){ const r=await uploadFile(expDraft.file,1800); fileId=r.id; fileType=r.contentType; }
      const id=uid(); await put("expenses",id,{id,...v,amount:a,fileId,fileType,by:S.me||"",createdAt:new Date().toISOString()}); S.expMonth=(v.date||today()).slice(0,7); },"Expense saved");
    if(ok){ if(expDraft?.preview) URL.revokeObjectURL(expDraft.preview); closeModal(); if(S.view!=="expenses") go("expenses"); } else { el.disabled=false; el.textContent="Save expense"; } },
  expView: ds=> expView(ds.id),
  expDl: async ds=>{ const e=S.expenses.find(x=>x.id===ds.id); try{ const b=await (await fetch(blobUrl(e.fileId))).blob(); const ext=String(e.fileType).includes("pdf")?"pdf":String(e.fileType).includes("png")?"png":"jpg"; saveFile(`Receipt ${e.date} ${e.vendor||e.category}.${ext}`.replace(/[\/\\:*?"<>|]/g,""), b); }catch(err){ toast("Couldn't load the receipt file."); } },
  expDelAsk: ds=>{ $("#delZone").innerHTML=`<div class="confirm-box" style="width:100%"><b>Delete this expense and its photo?</b><div class="row"><button class="btn danger sm" data-act="expDel" data-id="${esc(ds.id)}">Delete</button><button class="btn sm" data-act="close">Keep</button></div></div>`; },
  expDel: async ds=>{ const e=S.expenses.find(x=>x.id===ds.id); if(await safe(async()=>{ await remove("expenses",e.id); if(e.fileId&&assets) try{ await assets.delete(e.fileId);}catch(x){} },"Expense deleted")) closeModal(); },
  socialFor: ds=>{ const c=client(ds.id); S.socialClient=c.id; S.socialPhoto=c.photoId||null; S.socialMode="all"; S.socialZoom=1; S.socialX=0; S.socialY=0; go("social"); },
  socialMode: ds=>{ S.socialMode=ds.v; render(); },
  igReview: ()=>{ const cv=$("#socCanvas"); const c=client(S.socialClient); if(!cv||!c) return;
    const cap=$("#socCap").value; const url=cv.toDataURL("image/jpeg",0.92);
    openModal(`${head("Check the post", "This is exactly what goes on @"+esc(S.ig.username||""))}
      <div class="ig-review"><img src="${url}" alt="Finished post for ${esc(c.name)}"><div class="grid" style="gap:12px;align-content:start">
       <div class="field"><label for="igCap">Caption</label><textarea id="igCap" rows="9">${esc(cap)}</textarea><span class="hint">${cap.length} / 2200 characters</span></div>
       <div id="igMsg"></div>
       <div class="row between"><button class="btn ghost" data-act="close">Not yet</button><button class="btn primary" data-act="igPost">${ic("camera")} Post now</button></div></div></div>`, true); },
  igPost: async (ds,el)=>{ const cv=$("#socCanvas"); const c=client(S.socialClient); const cap=$("#igCap").value.slice(0,2200);
    el.disabled=true; el.innerHTML="Posting… this can take up to a minute";
    try{
      const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));
      const fd=new FormData(); fd.append("image",blob,"post.jpg"); fd.append("caption",cap); fd.append("clientId",c.id);
      const r=await hostApi("ig_post",fd,true);
      await patch("clients",c.id,{posted:true,postedAt:today(),igPermalink:r.permalink||"",igMediaId:r.id||""});
      openModal(`${head("Posted!")}<div class="ok-big">${ic("check",'width="28" height="28"')}<div><b>${esc(firstName(c.name))}'s post is live on Instagram.</b><div class="small muted">The client is marked as posted.</div></div></div>${r.permalink?`<a class="btn primary" href="${esc(r.permalink)}" target="_blank" rel="noopener">${ic("ext")} Open the post</a>`:""}`);
    }catch(e){ const m=$("#igMsg"); if(m) m.innerHTML=`<div class="banner">${esc(e.message)}</div>`; el.disabled=false; el.innerHTML=ic("camera")+" Try again"; } },
  igConnect: async (ds,el)=>{ const pick=$("#igPick"); const tok=$("#igTok");
    const body= pick ? {ig_user_id:pick.value, choose:true} : {token:(tok&&tok.value||"").trim()};
    if(!pick && !body.token) return toast("Paste the access token first");
    el.disabled=true; try{ S.ig=await hostApi("ig_connect",body); }catch(e){ S.ig={connected:false,error:e.message}; } render(); },
  igDisconnect: async ()=>{ try{ await hostApi("ig_disconnect",{}); S.ig={connected:false}; toast("Instagram disconnected"); }catch(e){ toast(e.message); } render(); },
  passedPhoto: async ds=>{ const f=await pickFile("image/*"); if(!f) return; toast("Uploading…");
    await safe(async()=>{ const r=await uploadFile(f,2000); await patch("clients",ds.id,{photoId:r.id}); S.socialClient=ds.id; S.socialPhoto=r.id; S.socialZoom=1;S.socialX=0;S.socialY=0; S.socialCaption=null; closeModal(); go("social"); },"Photo added · check the post"); },
  socialPhoto: async ()=>{ const f=await pickFile("image/*"); if(!f) return; toast("Uploading…"); await safe(async()=>{ const r=await uploadFile(f,2000); S.socialPhoto=r.id; S.socialZoom=1;S.socialX=0;S.socialY=0; const c=client(S.socialClient); if(c) await patch("clients",c.id,{photoId:r.id}); render(); },"Photo added"); },
  socialUseSaved: ()=>{ S.socialPhoto=client(S.socialClient).photoId; render(); },
  socialDl: async ()=>{ const cv=$("#socCanvas"); const c=client(S.socialClient); cv.toBlob(b=>{ if(b) saveFile(`Post ${c?c.name:"client"}.png`, b); else toast("Couldn't create the image."); },"image/png"); },
  socialCopy: ()=> copy($("#socCap").value,"Caption copied"),
  socialPosted: ()=>{ const c=client(S.socialClient); safe(()=>patch("clients",c.id,{posted:!c.posted,postedAt:!c.posted?today():""}), !c.posted?"Marked as posted":"Marked as not posted"); },
  saveSettings: async ()=>{ const v=formVals($("#setForm")); const prices={}; Object.keys(VEH).forEach(k=>prices[k]=[0,1,2,3].map(i=>num(v[`p_${k}_${i}`])));
    const p={business:v.business,phone:v.phone,address:v.address,email:v.email,kvk:v.kvk,crib:v.crib,bank:v.bank,invoicePrefix:(v.invoicePrefix||"TA").trim(),obRate:num(v.obRate),obBasis:v.obBasis,reminder:v.reminder,caption:v.caption,prices,extraRates:Object.fromEntries(Object.keys(VEH).map(k=>[k,v[`x_${k}`]===""?"":num(v[`x_${k}`])]))};
    await safe(()=>saveSettings(p),"Settings saved"); },
  tplUpload: async ()=>{ const f=await pickFile("image/png,image/jpeg"); if(!f) return; toast("Uploading template…");
    let info; try{ info=await analyzeTemplate(f); }catch(e){ return toast("That image couldn't be read. Use a PNG or JPG."); }
    await safe(async()=>{ const r=await assets.upload(f,{type:f.type||"image/png"}); TB=null; await saveSettings({templateId:r.id, photoBox:info.box, tplMode:info.mode, nameOn:true, nameY:1220}); },
      info.mode==="behind"?"Template saved · photo area found automatically":"Template saved · drag the blue box to where the photo goes"); },
  tplRemove: ()=> safe(()=>saveSettings({templateId:null}),"Using built-in template"),
  backupExport: ()=>{ const out={app:"trusty-ofisina",version:1,exportedAt:new Date().toISOString(),settings:S.settings||{}}; COLS.forEach(c=>out[c]=S[c]);
    saveFile(`Trusty backup ${today()}.json`, JSON.stringify(out,null,1)); },
  backupImport: async ()=>{ const f=await pickFile("application/json,.json"); if(!f) return;
    let data; try{ data=JSON.parse(await f.text()); }catch(e){ return toast("That file isn't a Trusty backup."); }
    if(!data || data.app!=="trusty-ofisina") return toast("That file isn't a Trusty backup.");
    const n=COLS.reduce((a,c)=>a+((data[c]||[]).length),0);
    openModal(`${head("Restore backup?", "From "+esc((data.exportedAt||"").slice(0,10)))}<div>This adds <b>${n}</b> records to this app. Records with the same ID are replaced by the version in the backup. Nothing else is deleted.</div><div class="row between"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="backupImportYes">Restore</button></div>`);
    ACT._pendingImport=data; },
  backupImportYes: async (ds,el)=>{ const data=ACT._pendingImport; if(!data) return; el.disabled=true; let done=0;
    const ok=await safe(async()=>{ for(const c of COLS) for(const d of (data[c]||[])){ if(!d||!d.id) continue; const {id,...rest}=d; await put(c,String(id),{id,...rest}); done++; }
      if(data.settings && Object.keys(data.settings).length) await db.doc("settings/main").set(data.settings); });
    ACT._pendingImport=null; closeModal(); if(ok) toast(`Restored ${done} records`); },
  savePb: ()=>{ const pb={}; document.querySelectorAll("[data-pb]").forEach(i=>pb[i.dataset.pb]=num(i.value)); if(pb.w<=0||pb.h<=0) return toast("Width and height must be above 0"); safe(()=>saveSettings({photoBox:pb}),"Photo area saved"); }
};
function lessonsForSchedule(){ return S.lessons.filter(l=>l.date===S.day&&l.status!=="cancelled"&&(S.dayInst==="all"||l.instructor===S.dayInst)).sort((a,b)=>(a.time||"").localeCompare(b.time||"")); }
async function copy(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch(e){ openModal(`${head("Copy this text")}<textarea id="cpy" rows="10" readonly>${esc(t)}</textarea>`); const a=$("#cpy"); a.focus(); a.select(); } }

/* template editor: drag the photo box on #tplCanvas */
(function(){ let drag=null; const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const pt=(cv,e)=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*1080/r.width, y:(e.clientY-r.top)*1350/r.height}; };
  document.addEventListener("pointerdown",e=>{ const cv=e.target.closest&&e.target.closest("#tplCanvas"); if(!cv) return; e.preventDefault();
    const p=pt(cv,e); const b={...(TB||cfg().photoBox||DEFAULTS.photoBox)}; TB={...b};
    const corner=Math.abs(p.x-(b.x+b.w))<80&&Math.abs(p.y-(b.y+b.h))<80, inside=p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
    drag={mode:corner?"resize":inside?"move":"new",sx:p.x,sy:p.y,b};
    if(drag.mode==="new"){ TB={x:p.x,y:p.y,w:60,h:60}; drag.b={...TB}; drag.mode="resize"; }
    try{ cv.setPointerCapture(e.pointerId); }catch(x){} });
  document.addEventListener("pointermove",e=>{ if(!drag) return; const cv=$("#tplCanvas"); if(!cv) return; const p=pt(cv,e), dx=p.x-drag.sx, dy=p.y-drag.sy, b=drag.b;
    TB = drag.mode==="move" ? {...b,x:clamp(b.x+dx,-b.w+60,1020),y:clamp(b.y+dy,-b.h+60,1290)} : {x:b.x,y:b.y,w:clamp(b.w+dx,60,1080-b.x+200),h:clamp(b.h+dy,60,1350-b.y+200)};
    drawTplEditor(); });
  const end=()=>{ if(!drag) return; drag=null; const b={x:Math.round(TB.x),y:Math.round(TB.y),w:Math.round(TB.w),h:Math.round(TB.h)}; safe(()=>saveSettings({photoBox:b}),"Photo area saved"); };
  document.addEventListener("pointerup",end); document.addEventListener("pointercancel",end);
})();
document.addEventListener("pointerdown", e=>{
  const el=e.target.closest(".btn,.chip,.icon-btn,.item,.pick,.nav-btn,.alert,.toggle,.thumb,.wday,.bottom button"); if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=el.getBoundingClientRect(), sz=Math.max(r.width,r.height)*2.2, sp=document.createElement("span");
  sp.className="ripple"; sp.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px`; el.appendChild(sp); setTimeout(()=>sp.remove(),650);
});
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const fn=ACT[t.dataset.act]; if(!fn) return;
  if(t.tagName==="A"){ fn(t.dataset,t,e); return; } // links keep their default (open WhatsApp etc.)
  e.preventDefault(); fn(t.dataset,t,e);
});
document.addEventListener("input", e=>{
  const k=e.target.dataset.in; if(!k) return;
  if(k==="q"){ S.q=e.target.value; const l=$("#clist"), list=filteredClients(); if(l && list.length) l.innerHTML=list.map(clientRow).join(""); else render(); }
  else if(k==="wizPaid") wizLeft();
  else if(k==="socialCaption"){ S.socialCaption=e.target.value; S.socialCaptionFor=S.socialClient; }
  else if(k==="extraCalc") extraCalc();
  else if(k.startsWith("social")){ S[k]=Number(e.target.value); drawSocial(); }
});
document.addEventListener("change", e=>{
  if(e.target.name==="cid"){ lessonCheck(); return; }
  const k=e.target.dataset.change; if(!k) return; const v=e.target.value, id=e.target.dataset.id;
  if(k==="day"&&v){ S.day=v; render(); }
  else if(k==="examDate") safe(()=>patch("clients",id,{examDate:v}),"Exam date saved");
  else if(k==="examResult"){ const p={examResult:v}; if(v==="passed") p.status="passed"; else if((client(id)?.status)==="passed") p.status="active";
    safe(()=>patch("clients",id,p), v==="passed"?"":"Saved").then(ok=>{ if(ok&&v==="passed"){ const c=client(id);
      openModal(`${head("Pabien, "+esc(firstName(c?.name))+"!", "Marked as passed")}<div>Upload the photo from the exam. It's placed in your template with the caption, and you check it before it's posted.</div>
        <div class="row between"><button class="btn ghost" data-act="close">Later</button><button class="btn primary" data-act="passedPhoto" data-id="${esc(id)}" ${assets?"":"disabled"}>${ic("camera")} Upload photo</button></div>`); } }); }
  else if(k==="tplSet"){ const key=e.target.dataset.k; const val= e.target.type==="checkbox"? e.target.checked : (["photoRadius","nameY","nameSize"].includes(key)? num(v) : v); safe(()=>saveSettings({[key]:val})); }
  else if(k==="socialClient"){ S.socialCaption=null; S.socialClient=v||null; const c=client(v); S.socialPhoto=c?.photoId||null; S.socialZoom=1;S.socialX=0;S.socialY=0; render(); }
  else if(k==="lessonClient"){ const c=client(v); if(c){ if($("#l_v")) $("#l_v").value=c.vehicle; $("#l_i").value=c.instructor||$("#l_i").value; } lessonCheck(); }
  else if(k==="lessonCheck") lessonCheck();
});
try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelector(".city")?.pauseAnimations(); }catch(e){}
boot();
</script>
